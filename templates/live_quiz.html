{% extends "base.html" %} {% block title %}Live JavaScript Quiz{% endblock %} {% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}" />
{% endblock %} {% block content%}
<main class="container">
  <h1>Live JavaScript Quiz</h1>
  <section id="quizPanel">
    <!-- The quiz's states. live_quiz.js shows the one that applies. -->
    <p id="loading">Loading…</p>
    <p id="error" class="error-box" hidden></p>
    <button id="retryBtn" hidden onclick="init()">Try again</button>
    <p id="empty" hidden>There are no questions yet. Please come back later.</p>

    <!-- The quiz itself stays hidden until a question has loaded. -->
    <div id="quizContent" hidden>
      <p id="progress"></p>
      <h2 id="questionText"></h2>
      <div id="choices"></div>
      <div class="navigation">
        <button id="firstBtn" onclick="goFirst()">First</button>
        <button id="previousBtn" onclick="goPrevious()">Previous</button>
        <button id="nextBtn" onclick="goNext()">Next</button>
        <button id="lastBtn" onclick="goLast()">Last</button>
      </div>
      <button id="submitBtn" class="submit" onclick="submitQuiz()">Submit Quiz</button>
    </div>
  </section>
  <section id="resultsPanel">
    <h2>Quiz Results</h2>
    <p id="scoreText"></p>
    <p id="percentageText"></p>
    <p id="performanceText"></p>
    <h3>Correction</h3>
    <pre id="correction"></pre>
  </section>
</main>
<script src="{{ url_for('static', filename='live_quiz.js') }}"></script>
{% endblock %}
